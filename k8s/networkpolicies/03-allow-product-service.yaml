apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-product-service
  namespace: ecom
spec:
  podSelector:
    matchLabels:
      app: product-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend
        - podSelector:
            matchLabels:
              app: order-service
        # Deliberate, narrow exception for the deployment-strategies
        # practice lab (a different namespace) - see 02-allow-user-service.yaml
        # for the full explanation of this pattern.
        - podSelector:
            matchLabels:
              app: frontend
          namespaceSelector:
            matchLabels:
              purpose: deployment-strategies-practice
      ports:
        - port: 8000
