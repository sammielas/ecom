apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service-green
  namespace: deploy-strategies-lab
  labels:
    app: order-service
    slot: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
      slot: green
  template:
    metadata:
      labels:
        app: order-service
        slot: green
    spec:
      containers:
        - name: order-service
          image: localhost/order-service:cart-feature
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "postgresql://postgres:postgres@postgres.ecom.svc.cluster.local:5432/ecommerce"
            - name: VERSION_LABEL
              value: "green"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
